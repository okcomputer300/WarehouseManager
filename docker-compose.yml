services:
  web:
    context: ./src/web
    container_name: web
    ports:
      - "8080:8080"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: '512M'
        reservations:
          memory: '128M'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
    
  db: 
    image: mysql:8.0
    container_name: web-db
    restart: always
    environment:
      - MYSQL_DATABASE: ${DB_NAME}
      - MYSQL_USER: ${DB_USER}
      - MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
